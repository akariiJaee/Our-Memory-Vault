<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>our memory vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fff7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Memory Vault">  
<script>try{if(localStorage.getItem('vault-theme-last')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>


<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];

  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      serviceWorkerPath: "/Our-Memory-Vault/onesignal/OneSignalSDKWorker.js",
      serviceWorkerParam: { scope: "/Our-Memory-Vault/onesignal/" },
      appId: "d4d0137c-4256-43c1-b49d-73f60322520c",
      safari_web_id: "web.onesignal.auto.1592f4e8-7629-48b3-b916-fa35b5011e11",
      notifyButton: {
        enable: true
      }
    });
  });
</script>

</head>
<body>

<div class="bg-dots"></div>
<div class="petals" id="petals"></div>
<div class="clouds" id="clouds"></div>
<div class="hydrangea bl" id="hydrangeaBL"></div>
<div class="hydrangea tr" id="hydrangeaTR"></div>

<div id="loginScreen" class="loginform">
  <div class="lic" id="loginIcon"></div>
  <h3>sign in to your vault</h3>
  <p style="color:var(--ink-light);font-size:12.5px;margin:-4px 0 14px;">only the two IDs you two made up can get in — no real email needed.</p>
  <input type="email" id="loginEmail" placeholder="Enter ID" autocomplete="username">
  <input type="password" id="loginPassword" placeholder="password" autocomplete="current-password">
  <button class="addbtn" id="loginBtn"></button>
  <div class="err" id="loginError"></div>
</div>

<div id="appWrap" style="display:none;">
  <button id="menuToggle"></button>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <span class="ico" id="brandIcon"></span>
        <span class="brand-text">our memory vault<small>just us two</small></span>
      </div>
      <nav class="mainnav" id="mainnav"></nav>
      <div class="usertag" id="userTag"></div>
      <button class="logoutbtn" id="logoutBtn"></button>
      <button class="themebtn" id="themeBtn"></button>
    </aside>
    <main id="main"></main>
  </div>
</div>

<div id="lightbox"><button class="close"></button><div id="lightboxInner"></div></div>
<div id="letterOverlay"><div id="letterInner"></div></div>
<div class="savedflag" id="savedFlag"></div>
<button id="saveNowBtn" class="savenowbtn"></button>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="cloudinary-config.js"></script>
<script src="script.js"></script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js")
      .catch(function (error) {
        console.error("Service worker registration failed:", error);
      });
  });
}
</script>

</body>
</html>
